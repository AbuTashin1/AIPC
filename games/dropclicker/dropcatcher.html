<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Drop Catcher — AIPC Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="dropcatcher.css" />
</head>
<body>
<main class="game-main">

    <!-- HUD -->
    <div class="hud" id="hud">
        <div class="hud-left">
            <a href="../games.html" class="back-btn" title="Back to Games">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <div class="hud-stat">
                <span class="hud-label">SCORE</span>
                <span class="hud-value" id="scoreDisplay">0</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">BEST</span>
                <span class="hud-value" id="bestDisplay">0</span>
            </div>
        </div>
        <div class="hud-center">
            <div class="level-badge" id="levelBadge">LEVEL 1</div>
        </div>
        <div class="hud-right">
            <div class="hud-stat">
                <span class="hud-label">LIVES</span>
                <div class="hearts" id="heartsDisplay">
                    <span class="heart">💧</span>
                    <span class="heart">💧</span>
                    <span class="heart">💧</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Outer centers and caps the arena on wide screens -->
    <div class="arena-outer">
        <div class="arena-wrap" id="arenaWrap">
            <canvas id="gameCanvas"></canvas>

            <!-- START -->
            <div class="overlay" id="startScreen">
                <div class="overlay-card">
                    <div class="overlay-icon">💧</div>
                    <h1 class="overlay-title">Drop <em>Catcher</em></h1>
                    <p class="overlay-sub">Catch drops. Dodge bombs. Unite the ocean.</p>
                    <div class="legend">
                        <div class="legend-row"><span class="leg-icon">💧</span><span>Catch it — +10 pts</span></div>
                        <div class="legend-row"><span class="leg-icon">💣</span><span>Dodge it — lose a life</span></div>
                        <div class="legend-row"><span class="leg-icon">✨</span><span>Golden drop — +25 pts</span></div>
                    </div>
                    <div class="controls-hint">🖱 Mouse &nbsp;·&nbsp; 👆 Touch anywhere</div>
                    <button class="play-btn" id="startBtn">Play Now</button>
                    <div class="best-line" id="startBest"></div>
                </div>
            </div>

            <!-- GAME OVER -->
            <div class="overlay hidden" id="gameOverScreen">
                <div class="overlay-card">
                    <div class="overlay-icon">💥</div>
                    <h1 class="overlay-title">Game <em>Over</em></h1>
                    <div class="result-grid">
                        <div class="result-box"><span class="result-val" id="finalScore">0</span><span class="result-lbl">Score</span></div>
                        <div class="result-box"><span class="result-val" id="finalBest">0</span><span class="result-lbl">Best</span></div>
                        <div class="result-box"><span class="result-val" id="finalLevel">1</span><span class="result-lbl">Level</span></div>
                        <div class="result-box"><span class="result-val" id="finalDrops">0</span><span class="result-lbl">Caught</span></div>
                    </div>
                    <div class="new-best-banner hidden" id="newBestBanner">🏆 New Best!</div>
                    <button class="play-btn" id="retryBtn">Play Again</button>
                    <a href="games.html" class="overlay-back">← Back to Games</a>
                </div>
            </div>

            <!-- PAUSE -->
            <div class="overlay hidden" id="pauseScreen">
                <div class="overlay-card">
                    <div class="overlay-icon">⏸</div>
                    <h1 class="overlay-title">Paused</h1>
                    <button class="play-btn" id="resumeBtn">Resume</button>
                    <a href="games.html" class="overlay-back">← Quit to Games</a>
                </div>
            </div>
        </div>
    </div>

    <div class="combo-flash hidden" id="comboFlash"></div>
</main>

<script src="dropcatcher.js"></script>
</body>
</html>
